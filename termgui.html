<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/src/style.css" rel="stylesheet">
  <title>TermGui preview</title>
</head>
<body class="m-0 text-2xl font-vt323 flex h-screen flex-col bg-[#1d1d1d] text-[#ebebeb]">
  <header class="flex items-center gap-4 border-b border-gray-700 bg-gray-800 p-4">
    <p class="m-0">Path: <span id="path">/</span></p>
  </header>
  <main class="flex min-h-0 flex-1 flex-col md:flex-row">
    <section class="min-h-0 flex-1 overflow-y-auto border-r border-gray-700 p-4" aria-label="Directories and files">
      <button id="backButton" class="rounded px-3 text-3xl py-2 cursor-pointer" type="button">..</button>
      <div class="ml-12 text-4xl" id="currentDir"></div>
    </section>
    <section class="min-h-0 flex-1 overflow-y-auto bg-gray-900 p-4" aria-label="File preview">
      <div id="consoleContents" class="flex mt-6 min-h-32 flex-wrap content-start gap-3">
        <p>Welcome to the goon room</p>
      </div>
    </section>
  </main>
  <script type="module" src="/src/termgui.ts"></script>
</body>
</html>
