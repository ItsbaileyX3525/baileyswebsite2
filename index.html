<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bailey's Website - Coming Soon">
  <title>Bailey's Website - Coming Soon</title>
  <link rel="stylesheet" href="output.css">
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    .float {
      animation: float 6s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen flex items-center justify-center text-white overflow-hidden">
  <!-- Animated background elements -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-10 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 float"></div>
    <div class="absolute top-40 right-10 w-72 h-72 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 float" style="animation-delay: 2s;"></div>
    <div class="absolute -bottom-8 left-1/2 w-72 h-72 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 float" style="animation-delay: 4s;"></div>
  </div>

  <!-- Main content -->
  <div class="relative z-10 text-center px-4 max-w-2xl mx-auto">
    <div class="mb-8">
      <div class="inline-block">
        <div class="text-6xl font-black bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 bg-clip-text text-transparent mb-4 animate-pulse">
          Bailey's Website
        </div>
      </div>
    </div>

    <h2 class="text-2xl md:text-3xl font-bold mb-6 text-gray-100">
      Coming Soon
    </h2>

    <p class="text-lg text-gray-300 mb-8 leading-relaxed">
      I'm building something amazing. Check back soon for updates, projects, and more.
    </p>

    <!-- Status indicators -->
    <div class="grid grid-cols-3 gap-4 mb-12">
      <div class="bg-gradient-to-br from-purple-500/20 to-purple-900/20 border border-purple-500/30 rounded-lg p-4 backdrop-blur">
        <div class="text-3xl font-bold text-purple-400 mb-2">25%</div>
        <div class="text-sm text-gray-400">In Progress</div>
      </div>
      <div class="bg-gradient-to-br from-blue-500/20 to-blue-900/20 border border-blue-500/30 rounded-lg p-4 backdrop-blur">
        <div class="text-3xl font-bold text-blue-400 mb-2">∞</div>
        <div class="text-sm text-gray-400">Potential</div>
      </div>
      <div class="bg-gradient-to-br from-pink-500/20 to-pink-900/20 border border-pink-500/30 rounded-lg p-4 backdrop-blur">
        <div class="text-3xl font-bold text-pink-400 mb-2">🚀</div>
        <div class="text-sm text-gray-400">Ready Soon</div>
      </div>
    </div>

    <!-- CTA Button -->
    <div class="mb-12">
      <button class="bg-gradient-to-r from-cyan-500 to-purple-500 hover:from-cyan-600 hover:to-purple-600 text-white font-bold py-3 px-8 rounded-lg transition-all transform hover:scale-105 duration-200 shadow-lg">
        Notify Me
      </button>
    </div>

    <!-- Footer -->
    <div class="pt-8 border-t border-gray-700/50">
      <p class="text-sm text-gray-500 mb-4">
        🌐 Stay tuned for launch
      </p>
      <div class="flex justify-center gap-6">
        <a href="#" class="text-gray-400 hover:text-purple-400 transition">Twitter</a>
        <a href="#" class="text-gray-400 hover:text-purple-400 transition">GitHub</a>
        <a href="#" class="text-gray-400 hover:text-purple-400 transition">LinkedIn</a>
      </div>
    </div>
  </div>
</body>
</html>
